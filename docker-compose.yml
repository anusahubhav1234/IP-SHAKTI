services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sakti}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sakti}
      POSTGRES_DB: ${POSTGRES_DB:-sakti}
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sakti}"]
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-sakti}:${POSTGRES_PASSWORD:-sakti}@db:5432/${POSTGRES_DB:-sakti}
    depends_on:
      db: { condition: service_healthy }
    ports: ["8000:8000"]
    volumes: [uploads:/app/storage, hfcache:/root/.cache/huggingface]

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    depends_on: [backend]
    ports: ["5173:80"]

volumes:
  pgdata:
  uploads:
  hfcache:
